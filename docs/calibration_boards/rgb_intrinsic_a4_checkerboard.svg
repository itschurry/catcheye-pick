<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <title>RGB intrinsic calibration board - A4 checkerboard</title>
  <desc>A4 landscape, 10 x 7 squares, 20 mm square size, 9 x 6 inner corners.</desc>
  <defs>
    <pattern id="checker20" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="#000"/>
      <rect x="20" y="20" width="20" height="20" fill="#000"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="297" height="210" fill="#fff"/>
  <rect x="5" y="5" width="287" height="200" fill="none" stroke="#bbb" stroke-width="0.2"/>

  <g id="board" transform="translate(48.5 35)">
    <rect x="0" y="0" width="200" height="140" fill="#fff"/>
    <rect x="0" y="0" width="200" height="140" fill="url(#checker20)"/>
    <rect x="0" y="0" width="200" height="140" fill="none" stroke="#000" stroke-width="0.35"/>
  </g>

  <g id="trim-marks" stroke="#000" stroke-width="0.25">
    <path d="M48.5 29v-8M48.5 29h-8"/>
    <path d="M248.5 29v-8M248.5 29h8"/>
    <path d="M48.5 181v8M48.5 181h-8"/>
    <path d="M248.5 181v8M248.5 181h8"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#000">
    <text x="148.5" y="18" font-size="6" text-anchor="middle">RGB INTRINSIC - A4 - 10x7 squares - 20 mm</text>
    <text x="148.5" y="196" font-size="4.5" text-anchor="middle">OpenCV patternSize: 9x6 inner corners, squareSize: 0.020 m, print at 100%</text>
  </g>
</svg>
