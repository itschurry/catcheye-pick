<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
  <title>RGB CubeEye extrinsic calibration board - A3 checkerboard</title>
  <desc>A3 landscape, 9 x 6 squares, 40 mm square size, 8 x 5 inner corners.</desc>
  <defs>
    <pattern id="checker40" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="40" fill="#000"/>
      <rect x="40" y="40" width="40" height="40" fill="#000"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="420" height="297" fill="#fff"/>
  <rect x="6" y="6" width="408" height="285" fill="none" stroke="#bbb" stroke-width="0.25"/>

  <g id="board" transform="translate(30 28.5)">
    <rect x="0" y="0" width="360" height="240" fill="#fff"/>
    <rect x="0" y="0" width="360" height="240" fill="url(#checker40)"/>
    <rect x="0" y="0" width="360" height="240" fill="none" stroke="#000" stroke-width="0.5"/>
  </g>

  <g id="mount-guides" fill="none" stroke="#777" stroke-width="0.3" stroke-dasharray="2 2">
    <circle cx="18" cy="18" r="3.5"/>
    <circle cx="402" cy="18" r="3.5"/>
    <circle cx="18" cy="279" r="3.5"/>
    <circle cx="402" cy="279" r="3.5"/>
  </g>

  <g id="trim-marks" stroke="#000" stroke-width="0.3">
    <path d="M30 20v-10M30 20h-10"/>
    <path d="M390 20v-10M390 20h10"/>
    <path d="M30 277v10M30 277h-10"/>
    <path d="M390 277v10M390 277h10"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#000">
    <text x="210" y="18" font-size="8" text-anchor="middle">RGB-CUBEEYE EXTRINSIC - A3 - 9x6 squares - 40 mm</text>
    <text x="210" y="284" font-size="5" text-anchor="middle">OpenCV patternSize: 8x5 inner corners, squareSize: 0.040 m, mount on a flat rigid matte board, print at 100%</text>
  </g>
</svg>
